[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-mcp"
version = "0.1.0"
description = "Demo-focused MCP analytics server for Claude Desktop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "motor>=3.7.1",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
