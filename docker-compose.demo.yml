services:
  mongodb:
    image: mongo:7
    container_name: analysismcp-demo-db
    ports:
      # No auth on this instance, so only accept connections from this machine
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: analysis_mcp_demo
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
